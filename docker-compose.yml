version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: insightiq-postgres
    environment:
      POSTGRES_USER: insightiq
      POSTGRES_PASSWORD: insightiq_password_2026
      POSTGRES_DB: insightiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightiq -d insightiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightiq-backend
    environment:
      - DATABASE_URL=postgresql://insightiq:insightiq_password_2026@postgres:5432/insightiq_db
      - SECRET_KEY=insightiq_super_secret_enterprise_jwt_key_2026_99x
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insightiq-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: insightiq-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
